name: Pull Request Checks

on:
  pull_request:
    branches:
      - master

jobs:
  pr-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Install pnpm 🔧
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: CI=true pnpm i

      - name: Run TypeScript typecheck
        run: pnpm run check

      - name: Run Lint Checker
        run: pnpm run lint

      - name: Run Build
        run: pnpm run build

  claude-pr-deploy:
    if: startsWith(github.head_ref, 'claude/')
    runs-on: ubuntu-latest
    needs: pr-checks
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          date=$(date +%Y%m%d%H%M%S)
          VERSION="1.0.0-${date}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Viam Build 🚀
        uses: viamrobotics/build-action@FEAT-use-meta-input
        with:
          version: ${{ steps.version.outputs.version }}
          ref: ${{ github.event.pull_request.head.ref }}
          key-id: ${{ secrets.viam_key_id }}
          key-value: ${{ secrets.viam_key_value }}
          meta-path: meta-claude.json
